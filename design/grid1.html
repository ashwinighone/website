<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial=scale=1.0"/>
<title>Document</title>

<style>
*{
padding:0;
margin:0;
box-sizing:border-box;
}

.container{
width:80%;
min-height:100px;
margin:auto;
border:1px solid #000;
display:grid;
grid-template-columns:repeat(3,1fr);
grid-template-rows:60px auto 200px 300px 50px;
grid-auto-rows:50px;
gap:0.4rem;

grid-template-areas:
"header header header"
"slider slider slider"
"bar box1 box2"
"bar cont cont"
"footer footer footer";
}

.header{
backgound-color:royalblue;
grid-area:header;
display:grid;
grid-template-columns:repeat(2,1fr);
grid-template-rows:40px;
border:1px solid white;
display:flex;
justify-content:space-between;
align-items:center;
}

.slider{
grid-area:slider'
}

.slider img{
width:100%;
height:100%;
}

.bar{
background-color:gray;
grid-area:bar;
}

.box1{
background-color:gray;
grid-area:bar;
}

.box2{
background-color:lightseagreen;
grid-area:box1;
}

.const{
background-color:purple;
grid-area:cont;
}
.footer{
background-color:choclate;
grid-area:footer;
}

.item{
 color:white;
  font-size:16px;
}

</style>
</head>
<body>
<div class="container">
<div class="item header">
<div class="logo">
<h1>ByteCode</h1>
</div>
<div class="menu">
<ul>
<li><a href="">Home</a></li>
<li><a href="">About</a></li>
<li><a href="">Services</a></li>
<li><a href="">Product</a></li>
<li><a href="">Contact</a></li>
</ul>
</div>
</div>
<div class="item slider">
<img src="./imgs"nature.jpeg" alt="nature" />
</div>

<div class="item bar"> bar</div>
<div class="item box1"> box1</div>
<div class="item box2"> box2</div>
<div class="item cont"> cont</div>
<div class="item footer">footer</div>
</div>
</body>
</html>
